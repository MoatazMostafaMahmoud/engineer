<script>
let currentLang = 'ar';
function toggleLanguage() {
  if(currentLang === 'ar') {
    currentLang = 'en';
    alert('Language switched to English');
    // هنا ممكن تغير محتوى الموقع للإنجليزية
  } else {
    currentLang = 'ar';
    alert('تم تغيير اللغة للعربية');
    // هنا ممكن تغير محتوى الموقع للعربية
  }
  
}
</script>
